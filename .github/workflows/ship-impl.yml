name: Ship Implementation

on:
  workflow_call:
    inputs:
      tag:
        description: Tag being released, e.g. v0.1.9
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  # tauri-action names the bundles after the version in tauri.conf.json, while the
  # tap workflow derives the version from the git tag. When they disagree the release
  # publishes assets under a name the cask url cannot resolve, and the failure only
  # surfaces after the GitHub release is already public.
  check-version:
    name: Check the tag matches the manifests
    runs-on: ubuntu-latest
    steps:
      # The tag, not the branch that happened to trigger the run: a manual
      # release of an existing tag would otherwise build and check `main`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}

      - name: Compare the tag with tauri.conf.json and Cargo.toml
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          WANT="${TAG#v}"
          CONF=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          NPM=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          echo "tag=$WANT tauri.conf.json=$CONF Cargo.toml=$CARGO package.json=$NPM"
          [ "$WANT" = "$CONF" ] || { echo "::error::tag $WANT does not match tauri.conf.json $CONF"; exit 1; }
          [ "$WANT" = "$CARGO" ] || { echo "::error::tag $WANT does not match Cargo.toml $CARGO"; exit 1; }
          [ "$WANT" = "$NPM" ] || { echo "::error::tag $WANT does not match package.json $NPM"; exit 1; }

      # The notes shown before an update come from the changelogs: a release
      # without an entry in both languages is refused here, not after the build.
      - name: Check both changelogs have an entry for the tag
        run: scripts/release-notes.sh "${{ inputs.tag }}" > /dev/null

  release:
    needs: [check-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: ''
          - platform: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            args: ''
          - platform: macos-latest
            triple: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # The sidecar is prefixed so the Linux packages don't claim
      # /usr/bin/ffmpeg, which the distribution's own ffmpeg package owns.
      #
      # It is built from the pinned, checksummed upstream sources rather than
      # downloaded from a third party: LGPL only (no x264/x265, so the app's
      # licence is respected) and audio only (a few MB instead of ~80).
      - name: Install pkg-config (macOS)
        if: runner.os == 'macOS'
        run: brew install pkgconf

      - name: Restore the ffmpeg sidecar
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/binaries
          key: ffmpeg-sidecar-${{ matrix.triple }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build the ffmpeg sidecar
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          scripts/build-ffmpeg.sh \
            "src-tauri/binaries/lightcutsoundz-ffmpeg-${{ matrix.triple }}" \
            "$RUNNER_TEMP/ffmpeg-build"

      - name: Check the updater signing key is available
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — the build would" \
                 "ship without latest.json and the in-app updater would 404."
            exit 1
          fi

      # Becomes the release body, and so the `notes` of latest.json that the
      # updater hands to the app. One block per language, `<!-- en -->` / `<!-- fr -->`.
      - name: Write the release notes
        id: notes
        run: |
          set -euo pipefail
          {
            echo 'body<<NOTES_EOF'
            scripts/release-notes.sh "${{ inputs.tag }}"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: LightCutSoundz ${{ inputs.tag }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            ### Downloads

            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `brew install --cask light-cut-soundz/tap/light-cut-soundz` |
            | Linux AppImage (x86_64 / ARM64) | `LightCutSoundz_*_amd64.AppImage` / `LightCutSoundz_*_aarch64.AppImage` |
            | Linux Debian/Ubuntu (x86_64 / ARM64) | `LightCutSoundz_*_amd64.deb` / `LightCutSoundz_*_arm64.deb` |

            ### Homebrew (macOS)
            ```
            brew tap light-cut-soundz/tap
            brew install --cask light-cut-soundz
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  verify-updater:
    name: Verify updater manifest
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      # The in-app updater reads latest.json from the release assets. Without
      # this gate a missing manifest only shows up as a silent 404 on users'
      # machines.
      - name: Assert latest.json was published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "${{ inputs.tag }}" \
            --repo ${{ github.repository }} \
            --json assets --jq '.assets[].name')
          echo "$ASSETS"
          if ! grep -qx 'latest.json' <<<"$ASSETS"; then
            echo "::error::latest.json is missing from ${{ inputs.tag }} — the in-app updater will 404."
            exit 1
          fi
          if ! grep -q '\.sig$' <<<"$ASSETS"; then
            echo "::error::no signature asset in ${{ inputs.tag }} — the updater rejects unsigned bundles."
            exit 1
          fi

  # install.sh checks what it downloads against this file, so it is published
  # with the release (still a draft) and before anyone can see it.
  checksums:
    name: Publish SHA256SUMS
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Hash the installable assets and attach the list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.AppImage'
          [ -n "$(ls)" ] || { echo "::error::no installable asset found"; exit 1; }
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ inputs.tag }}" SHA256SUMS --repo "${{ github.repository }}" --clobber

  # The release stays a draft while it is built: it only becomes public once
  # every platform has succeeded and the updater manifest is verified, so that a
  # single platform breaking never leaves users with an incomplete release.
  publish-release:
    name: Publish GitHub Release
    needs: [release, verify-updater, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag }}" --draft=false --latest --repo "${{ github.repository }}"
