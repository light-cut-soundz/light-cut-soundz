name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Lint and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
  rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev nasm
      - run: npm ci
      - run: npm run build
      # The build refuses to start without the sidecar; an empty executable is enough for tests.
      - name: Stub the ffmpeg sidecar
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/host: //p')
          touch "src-tauri/binaries/lightcutsoundz-ffmpeg-$triple"
          chmod +x "src-tauri/binaries/lightcutsoundz-ffmpeg-$triple"
      - run: cargo test
        working-directory: src-tauri
