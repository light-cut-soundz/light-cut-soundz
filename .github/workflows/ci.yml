name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust lint & tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # tauri-build resolves `externalBin` at build-script time and fails if the
      # sidecar is missing. Lint and tests never execute it, so a stub is enough
      # here; the release workflow downloads the real binary.
      - name: Stub the ffmpeg sidecar
        run: |
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 1\n' > src-tauri/binaries/lightcutsoundz-ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/lightcutsoundz-ffmpeg-x86_64-unknown-linux-gnu

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          cargo llvm-cov --workspace --summary-only \
            --ignore-filename-regex 'src-tauri/src/main\.rs' \
            --fail-under-lines 90

  js:
    name: JS lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build the frontend
        run: npm run build
