<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightCutSoundz</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">LightCut<span>Soundz</span></div>
      <div id="file-badge" class="file-badge hidden">
        <span id="badge-name"></span>
        <span id="badge-meta"></span>
      </div>
      <button id="open-btn-header" class="btn-ghost hidden" data-i18n-title="header.openOther">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span data-i18n="header.open">Open</span>
      </button>
    </header>

    <!-- Drop zone -->
    <section id="drop-zone" class="drop-zone">
      <div class="drop-inner">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12 0c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/>
        </svg>
        <p data-i18n="drop.title">Drop an audio file here</p>
        <span data-i18n="drop.or">or</span>
        <button id="open-btn" class="btn-ghost" data-i18n="drop.open">Open a file</button>
      </div>
    </section>

    <!-- Editor (hidden until file loaded) -->
    <section id="editor" class="editor hidden">

      <!-- Waveform -->
      <div class="waveform-container">
        <div class="player-bar">
          <button id="play-btn" class="play-btn" data-i18n-title="player.playPause" data-i18n-aria="player.playPause">
            <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </button>
          <span id="time-current" class="mono">0:00</span>
          <span class="time-sep">/</span>
          <span id="time-total" class="mono">0:00</span>
          <span class="player-hint" data-i18n="player.hint">Drag the handles to trim</span>
        </div>
        <canvas id="waveform" role="img" tabindex="0" data-i18n-aria="player.waveform"></canvas>
      </div>

      <!-- Controls grid -->
      <div class="controls-grid">

        <!-- Trim -->
        <div class="card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 20L12 4l6 16M4 15h16"/>
            </svg>
            <span data-i18n="trim.title">Trim</span>
            <label class="toggle"><input type="checkbox" id="trim-enabled" data-i18n-aria="trim.toggle"><span class="slider"></span></label>
          </div>
          <div class="card-body" id="trim-body">
            <div class="field-row">
              <label for="trim-start" data-i18n="trim.start">Start</label>
              <div class="input-unit"><input type="number" id="trim-start" value="0" min="0" step="0.1"><span>s</span></div>
            </div>
            <div class="field-row">
              <label for="trim-end" data-i18n="trim.end">End</label>
              <div class="input-unit"><input type="number" id="trim-end" value="0" min="0" step="0.1"><span>s</span></div>
            </div>
          </div>
        </div>

        <!-- Fade -->
        <div class="card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 20h20M2 4l10 12L22 4"/>
            </svg>
            <span data-i18n="fade.title">Fade</span>
          </div>
          <div class="card-body">
            <div class="field-row">
              <label for="fadein" data-i18n="fade.in">Fade in</label>
              <input type="range" id="fadein" min="0" max="10" step="0.1" value="0">
              <span class="range-val" id="fadein-val">0s</span>
            </div>
            <div class="field-row">
              <label for="fadeout" data-i18n="fade.out">Fade out</label>
              <input type="range" id="fadeout" min="0" max="10" step="0.1" value="0">
              <span class="range-val" id="fadeout-val">0s</span>
            </div>
            <div class="field-row">
              <label for="fade-curve" data-i18n="fade.curve">Curve</label>
              <select id="fade-curve">
                <option value="linear" data-i18n="fade.linear">Linear</option>
                <option value="equal-power" data-i18n="fade.equalPower">Equal power</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Volume -->
        <div class="card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            <span data-i18n="volume.title">Volume</span>
          </div>
          <div class="card-body">
            <label class="checkbox-row">
              <input type="checkbox" id="normalize">
              <span data-i18n="volume.normalize">Normalise (peak −1 dBFS)</span>
            </label>
          </div>
        </div>

        <!-- Speed -->
        <div class="card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span data-i18n="speed.title">Speed</span>
          </div>
          <div class="card-body">
            <div class="field-row">
              <input type="range" id="speed" min="0.25" max="3.0" step="0.05" value="1.0" data-i18n-aria="speed.title">
              <span class="range-val" id="speed-val">1.00×</span>
            </div>
            <div class="speed-presets">
              <button class="preset" data-v="0.5" aria-pressed="false">½×</button>
              <button class="preset active" data-v="1.0" aria-pressed="true">1×</button>
              <button class="preset" data-v="1.5" aria-pressed="false">1.5×</button>
              <button class="preset" data-v="2.0" aria-pressed="false">2×</button>
            </div>
          </div>
        </div>

        <!-- Filter -->
        <div class="card">
          <div class="card-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
            </svg>
            <span data-i18n="filter.title">Filter</span>
          </div>
          <div class="card-body">
            <select id="filter-type" data-i18n-aria="filter.title">
              <option value="" data-i18n="filter.none">None</option>
              <option value="lowpass" data-i18n="filter.lowpass">Low-pass</option>
              <option value="highpass" data-i18n="filter.highpass">High-pass</option>
              <option value="bandpass" data-i18n="filter.bandpass">Band-pass</option>
            </select>
            <div id="filter-params" class="hidden">
              <div class="field-row">
                <label id="filter-freq-label" for="filter-freq" data-i18n="filter.frequency">Frequency</label>
                <div class="input-unit">
                  <input type="number" id="filter-freq" value="1000" min="1" step="100">
                  <span>Hz</span>
                </div>
              </div>
              <div class="field-row" id="filter-slope-row">
                <label for="filter-slope" data-i18n="filter.slope">Slope</label>
                <select id="filter-slope">
                  <option value="12">12 dB/oct</option>
                  <option value="24">24 dB/oct</option>
                  <option value="36">36 dB/oct</option>
                  <option value="48">48 dB/oct</option>
                </select>
              </div>
              <div class="field-row" id="filter-q-row">
                <label for="filter-q" data-i18n="filter.q">Q</label>
                <div class="input-unit">
                  <input type="number" id="filter-q" value="0.707" min="0.1" max="20" step="0.05">
                </div>
              </div>
              <div class="field-row" id="filter-bw-row" style="display:none">
                <label for="filter-bw" data-i18n="filter.bandwidth">Bandwidth</label>
                <div class="input-unit">
                  <input type="number" id="filter-bw" value="500" min="1" step="50">
                  <span>Hz</span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div><!-- /controls-grid -->

      <!-- Export bar -->
      <div class="export-bar">
        <div class="format-tabs">
          <button class="fmt active" data-fmt="wav" aria-pressed="true">WAV</button>
          <button class="fmt" data-fmt="mp3" aria-pressed="false">MP3</button>
          <button class="fmt" data-fmt="flac" aria-pressed="false">FLAC</button>
          <button class="fmt" data-fmt="ogg" aria-pressed="false">OGG</button>
          <button class="fmt" data-fmt="m4a" aria-pressed="false">M4A</button>
        </div>
        <select id="wav-depth" class="depth-select" data-i18n-aria="export.depth">
          <option value="float32" data-i18n="depth.float32">32-bit float</option>
          <option value="pcm24" data-i18n="depth.pcm24">24-bit</option>
          <option value="pcm16" data-i18n="depth.pcm16">16-bit (dithered)</option>
        </select>
        <span id="export-hint" class="export-hint" role="status"></span>
        <button id="cancel-btn" class="btn-ghost hidden" data-i18n="export.cancel">Cancel</button>
        <button id="export-btn" class="btn-export">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span id="export-label" data-i18n="export.run">Export</span>
        </button>
      </div>

    </section><!-- /editor -->

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

  </div><!-- /app -->

  <script type="module" src="/src/main.js"></script>
</body>
</html>
